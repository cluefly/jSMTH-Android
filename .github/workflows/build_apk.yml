# This is a basic workflow to help you get started with Actions

name: Build_jSMTH_APK

# Controls when the action will run. Triggers the workflow on push or pull request
# events for the main branch
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'    
  pull_request:
    branches: [ main ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - name: checkout codes
      uses: actions/checkout@v4
      with:
        fetch-depth: '0' # 0 indicates all history, this is needed for git revision 

    # https://github.com/actions/setup-java
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Assemble Release APK
      run: ./gradlew assembleRelease --stacktrace
  
        
    - name: Create ZIPs
      working-directory: ./app/build/outputs/apk/
      run: |
        zip -r ./jsmth.zip ./release

    - name: Get APK version
      id: get_git_revision
      run: |
        echo "tag_name=$(jq -r .elements[0].versionCode app/build/outputs/apk/release/output-metadata.json)" >> "$GITHUB_OUTPUT"
        echo "release_name=$(jq -r .elements[0].versionCode app/build/outputs/apk/release/output-metadata.json)" >> "$GITHUB_OUTPUT"

    - name: Create Release and Upload APK
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: tag-${{ steps.get_git_revision.outputs.tag_name }}
        name: Release ${{ steps.get_git_revision.outputs.release_name }}
        draft: false
        prerelease: false
        files: ./app/build/outputs/apk/jsmth.zip
